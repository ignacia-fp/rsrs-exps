services:
  dev:
    platform: linux/amd64
    build:
      context: .
    environment:
      WORKSPACE: /work/rsrs-exps
      DEPS_DIR: /deps
      LOCAL_EXAFMM_DIR: /work/rsrs-exps/external/exafmm-t
      LOCAL_BEMPP_DIR: /work/rsrs-exps/external/bempp-cl
      LOCAL_KIFMM_DIR: /work/rsrs-exps/external/kifmm-for-rsrs
      BEMPP_KIFMM_ROOT: /work/rsrs-exps/external/kifmm-for-rsrs
      RSRS_ROOT: /work/rsrs
      SO_KERNELS_ROOT: /work/so-kernels
    volumes:
      - ..:/work:cached
      - deps:/deps
      - cargo-registry:/root/.cargo/registry
      - cargo-git:/root/.cargo/git
    working_dir: /work/rsrs-exps
    tty: true
    stdin_open: true

volumes:
  deps:
  cargo-registry:
  cargo-git:
