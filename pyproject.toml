[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rsrs-experiments"
version = "0.1.0.dev0"
description = "Parallel sampling, RSRS execution, reporting, and plotting workflows"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "threadpoolctl>=3.5,<4",
    "bempp-rsrs @ git+https://github.com/bempp/rsrs.git@python-sample-interface#subdirectory=python-native",
    "so-kernels[backends] @ git+https://github.com/ignacia-fp/so-kernels.git@main",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8,<4"]
legacy-cache = ["h5py>=3.10,<4"]
dev = ["pytest>=8,<10"]

[project.scripts]
rsrs-experiment = "rsrs_experiments.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/rsrs_experiments"]

[tool.hatch.metadata]
allow-direct-references = true
